# EPOCH Feature Lifecycle Workflow
# Reusable Bob workflow for the standard feature development golden path.
# Run this workflow to reproduce the full EPOCH demo from a clean state.
#
# Prerequisites:
#   1. pnpm demo-reset (seeds the database)
#   2. pnpm dev (starts API + MCP + console)
#   3. Bob IDE connected to epoch-evolution MCP server
#
# Usage in Bob IDE:
#   Open this file → Run workflow → Follow approval gates

name: feature-lifecycle
version: "1.0"
description: >
  EPOCH standard feature lifecycle workflow. Demonstrates the full
  WEAVE + EPOCH + Bob integration: event intake → context bundle →
  parallel specialist agents → Bob implementation → verification →
  approval gate → mutation recording → drift check → trajectory update.

trigger:
  type: manual
  input_prompt: >
    Describe the feature or change to implement. Include any relevant
    context about affected components and acceptance criteria.

context:
  mcp_servers:
    - epoch-evolution
  read_files:
    - ARCHITECTURE.md
    - docs/AGENTS.md
    - packages/sample-app/src/**/*.ts

steps:
  - id: intake
    name: Event Intake
    mode: agent
    description: >
      Create a normalised Event record from the user's input.
      Query EPOCH-MCP for current trajectory snapshot and relevant mutation history.
    tools:
      - mcp:epoch-evolution:get_trajectory_snapshot
      - mcp:epoch-evolution:get_mutation_history
      - mcp:epoch-evolution:check_invariants
    prompt: >
      Create a new workflow event from the provided requirement.
      Query the EPOCH evolution graph to understand the current system state
      before planning. Post the event to POST /api/events.
    output: workflow_id

  - id: context
    name: Context Bundle Assembly
    mode: agent
    description: >
      Assemble the full ContextBundle: repository snapshot, parsed requirements,
      prior mutations for affected components, active invariants, and provenance.
    depends_on: [intake]
    prompt: >
      Assemble the context bundle for workflow ${workflow_id}.
      Use the EPOCH-MCP tools to fetch prior mutation history for the components
      identified in the requirement. Surface any missing context explicitly.

  - id: plan
    name: Bob Plan Mode
    mode: plan
    description: >
      Bob analyses the context bundle and generates the lifecycle plan:
      task DAG, specialist agent assignments, parallel groups, acceptance criteria.
    depends_on: [context]
    prompt: >
      Review the context bundle for ${workflow_id}.
      Generate a complete lifecycle plan including:
      - Task graph with dependency edges
      - Which agents run in parallel
      - Explicit acceptance criteria derived from the requirement
      - Any risks or ambiguities that need resolution
      Surface the plan to the user before proceeding.

  - id: parallel_agents
    name: Parallel Specialist Agents
    mode: agent
    description: >
      Spawn Historian, Security, and QA as parallel subagents.
      Each runs independently and writes evidence to the store.
    depends_on: [plan]
    subagents:
      - id: historian
        name: Historian Agent
        prompt: >
          Analyse the git history and prior EPOCH mutations for the components
          identified in the context bundle. Use mcp:epoch-evolution:get_mutation_history.
          Surface relevant prior changes, incidents, and ADRs. Return Evidence records.
        tools:
          - mcp:epoch-evolution:get_mutation_history
          - mcp:epoch-evolution:check_invariants
        mode: agent

      - id: security
        name: Security Agent
        prompt: >
          Scan the proposed change for security vulnerabilities, dependency risks,
          and policy violations. No silent approval — always return at least one evidence record.
          Flag any auth boundary changes or new external dependencies.
        mode: agent

      - id: qa
        name: QA Agent
        prompt: >
          Assess test coverage for the proposed change.
          Generate tests for any acceptance criteria not yet covered.
          Run existing tests and report results. Return Evidence records with
          pass/fail counts and coverage percentages.
        mode: agent

    parallel: true

  - id: implement
    name: Bob Agent Mode — Implementation
    mode: agent
    description: >
      Bob implements the proposed change in a sandbox branch.
      Uses all specialist evidence as context. Stays within the scope
      defined in the plan.
    depends_on: [parallel_agents]
    branch: epoch/feature-${workflow_id}
    prompt: >
      Implement the change described in the lifecycle plan.
      Consider the findings from Historian, Security, and QA agents.
      Stay within the scope defined by the plan. Run tests after implementation.
      Do not commit directly to main — work on branch epoch/feature-${workflow_id}.

  - id: verify
    name: Verification
    mode: agent
    description: >
      QA agent re-runs tests on the implemented change.
      Security agent re-scans the final diff.
      Evidence store updated with final results.
    depends_on: [implement]
    subagents:
      - id: verify_qa
        name: QA Verification
        prompt: >
          Run all tests against the implementation on branch epoch/feature-${workflow_id}.
          Verify all acceptance criteria are met. Report any failures.
        mode: agent

      - id: verify_security
        name: Security Re-scan
        prompt: >
          Re-scan the final implementation diff for any new security concerns
          introduced during development.
        mode: agent

    parallel: true

  - id: approval_gate
    name: Human Approval Gate
    mode: pause
    description: >
      Workflow pauses for human review. Present the complete decision package:
      all specialist evidence, open questions, risk level, and recommended action.
    depends_on: [verify]
    prompt: >
      Present the decision package for ${workflow_id} to the user.
      Include: security findings, QA results, historian context, risk level.
      Wait for explicit APPROVE or REJECT decision.
    gate:
      type: human
      endpoint: POST /api/workflows/${workflow_id}/approve

  - id: commit_mutation
    name: Record Mutation
    mode: agent
    description: >
      Commit the approved change to main. Trigger the mutation engine.
      The mutation is recorded in the evolution graph and trajectory is recalculated.
    depends_on: [approval_gate]
    condition: approved
    prompt: >
      The change has been approved. Commit the implementation from branch
      epoch/feature-${workflow_id} to main. Post a mutation.committed event
      to POST /api/events to trigger evolution graph update.
    tools:
      - mcp:epoch-evolution:get_trajectory_snapshot

  - id: evolution_check
    name: Trajectory & Drift Analysis
    mode: agent
    description: >
      Evolution Analyst agent runs in background. Computes new trajectory point,
      runs drift patterns, checks phase detector. Results stream to console.
    depends_on: [commit_mutation]
    background: true
    prompt: >
      Analyse the trajectory after mutation ${mutation_id}.
      Run all drift patterns. Check epoch detector.
      If drift is detected, surface findings to the console and
      recommend a counterfactual simulation or remediation workflow.
    tools:
      - mcp:epoch-evolution:get_trajectory_snapshot
      - mcp:epoch-evolution:check_invariants
      - mcp:epoch-evolution:get_causal_chain

hooks:
  post_file_save:
    pattern: "packages/sample-app/src/**/*.ts"
    action: >
      Run a lightweight drift check on the component corresponding to
      the saved file. POST to /api/graph/check-drift with the component ID.

  post_task_exec:
    trigger: task_completed
    action: >
      When a specialist agent task completes, verify the evidence records
      it produced are well-formed. Alert if any evidence lacks a source_artifact_ref.
