name: Keep the live demo awake

# Render's free plan puts a service to sleep after 15 minutes without traffic.
# One quick ping every ten minutes, away from the busy top of the hour, leaves
# room for GitHub starting a scheduled run a few minutes late. The job never
# fails: an unreachable demo is reported as a warning in the run summary.
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping the live demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping /api/health
        env:
          URL: https://epoch-wj5b.onrender.com/api/health
        run: |
          code=$(curl -s -o health.json -w '%{http_code}' --max-time 60 --retry 3 --retry-delay 15 --retry-all-errors "$URL") || code=000
          now=$(date -u +%H:%M)
          if [ "$code" = "200" ]; then
            echo "Awake: $(head -c 160 health.json)"
            echo "Live demo awake at $now UTC" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The live demo answered $code at $now UTC"
            echo "Live demo answered $code at $now UTC" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
